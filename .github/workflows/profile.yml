name: Mise à jour du profil

on:
  schedule:
    - cron: "0 3 * * *"   # tous les jours à 3h UTC
  workflow_dispatch:       # bouton "Run workflow" manuel
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  stats:
    name: Cartes de statistiques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # indispensable : sans ça, "git add" échoue (code 128)
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}

  activity:
    name: Activité récente
    runs-on: ubuntu-latest
    needs: stats
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # récupère le commit des cartes fait juste avant
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "Mise à jour de l'activité récente"
          MAX_LINES: 5
